<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- CSS para todas las páginas -->
    <link rel="stylesheet" th:href="@{/css/body.css}">
    <link rel="stylesheet" th:href="@{/css/top-footer.css}">

    <!-- CSS específico de cada página -->
    <th:block th:replace="${extraCss} ?: ~{}"></th:block>

    <title th:text="${title} ?: 'Adopción de Mascotas'">Adopción de Mascotas</title>
</head>
<body>
<!-- Barra superior de la página -->
<nav>
    <ul class="nav-bar">
        <li>
            <a class="nav-link home"
               th:classappend="${activePage == 'index'} ? 'actual' : ''"
               th:href="@{/}">Inicio</a>
        </li>
        <li>
            <a class="nav-link"
               th:classappend="${activePage == 'adoption_list'} ? 'actual' : ''"
               th:href="@{/adoption-list}">Listado</a>
        </li>
        <li>
            <a class="nav-link"
               th:classappend="${activePage == 'adoption_stats'} ? 'actual' : ''"
               th:href="@{/adoption-stats}">Estadísticas</a>
        </li>
        <li>
            <a class="nav-link"
               th:classappend="${activePage == 'add_adoption'} ? 'actual' : ''"
               th:href="@{/add-adoption}">Publicar Aviso</a>
        </li>
    </ul>
</nav>

<!-- Contenido de la página -->
<main>
    <th:block th:replace="${content}"></th:block>
</main>

<!-- Scripts comunes -->
<th:block th:replace="${scripts} ?: ~{}"></th:block>

<!-- Fin de la página -->
<footer class="footer-bar">
    <div class="footer-contenido">
        <p>Desarrollado por Jorge Cummins.</p>
        <ul class="footer-links">
            <li>
                <a href="https://github.com/JorgeCSH/desarrollo_web_jorge_cummins"
                   class="footer-links-link"
                   target="_blank"
                   rel="noopener noreferrer">
                    Repositorio de la página
                </a>
            </li>
        </ul>
    </div>
</footer>
</body>
</html>
