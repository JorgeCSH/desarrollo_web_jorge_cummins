<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Fragment para mostrar la tabla de ultimos 5 avisos -->
<div th:fragment="ultimos-avisos (avisos)" id="get-last-pub" class="publicado-contenedor">
    <!-- Titulo de la lista -->
    <div class="item-contenedor titulo">Fecha de Publicación</div>
    <div class="item-contenedor titulo">Comuna</div>
    <div class="item-contenedor titulo">Sector</div>
    <div class="item-contenedor titulo">Cantidad, Tipo y Edad</div>
    <div class="item-contenedor titulo">Foto</div>

    <!-- Mostrar ultimos avisos desde la base de datos -->
    <th:block th:each="aviso : ${avisos}">
        <div class="item-contenedor"
             th:text="${aviso.fechaIngreso != null ? #temporals.format(aviso.fechaIngreso, 'yyyy-MM-dd HH:mm') : 'N/A'}">
        </div>
        <div class="item-contenedor" th:text="${aviso.comuna}"></div>
        <div class="item-contenedor"
             th:text="${aviso.sector != null ? aviso.sector : 'No especificado'}">
        </div>
        <div class="item-contenedor">
            <span th:text="${aviso.cantidad}"></span>
            <span th:text="${aviso.tipo}"></span>(s) de
            <span th:text="${aviso.edad}"></span>
            <span th:text="${aviso.unidadMedida == 'a' ? 'años' : 'meses'}"></span>
        </div>
        <div class="item-contenedor">
            <img th:if="${aviso.primeraFoto != null}"
                 th:src="@{${aviso.primeraFoto}}"
                 alt="Foto mascota"
                 style="max-width: 100px; max-height: 100px;">
            <span th:unless="${aviso.primeraFoto != null}">Sin foto</span>
        </div>
    </th:block>
</div>

<!-- Fragment para el listado completo de avisos -->
<div th:fragment="listado-avisos (avisos, page)">
    <div class="listado">
        <!-- Encabezados -->
        <div class="listado-header">
            <div class="listado-cabeza">Fecha Publicación</div>
            <div class="listado-cabeza">Fecha Entrega</div>
            <div class="listado-cabeza">Comuna</div>
            <div class="listado-cabeza">Sector</div>
            <div class="listado-cabeza">Cantidad / Tipo / Edad</div>
            <div class="listado-cabeza">Nombre Contacto</div>
            <div class="listado-cabeza">Total Fotos</div>
        </div>

        <!-- Filas desde la base de datos -->
        <div class="listado-body">
            <a th:each="aviso : ${avisos}"
               th:href="@{/adoption-list(page=${page}, avisoId=${aviso.id})}"
               style="text-decoration: none; color: inherit;">
                <div class="listado-fila"
                     style="cursor: pointer; padding: 10px; border-bottom: 1px solid #ddd;">
                    <div class="listado-celda"
                         th:text="${aviso.fechaIngreso != null ? #temporals.format(aviso.fechaIngreso, 'yyyy-MM-dd HH:mm') : 'N/A'}">
                    </div>
                    <div class="listado-celda"
                         th:text="${aviso.fechaEntrega != null ? #temporals.format(aviso.fechaEntrega, 'yyyy-MM-dd HH:mm') : 'N/A'}">
                    </div>
                    <div class="listado-celda" th:text="${aviso.comuna}"></div>
                    <div class="listado-celda"
                         th:text="${aviso.sector != null ? aviso.sector : 'No especificado'}">
                    </div>
                    <div class="listado-celda">
                        <span th:text="${aviso.cantidad}"></span>
                        <span th:text="${aviso.tipo}"></span>(s) /
                        <span th:text="${aviso.edad}"></span>
                        <span th:text="${aviso.unidadMedida == 'a' ? 'años' : 'meses'}"></span>
                    </div>
                    <div class="listado-celda" th:text="${aviso.nombreContacto}"></div>
                    <div class="listado-celda" th:text="${aviso.totalFotos}"></div>
                </div>
            </a>
        </div>
    </div>
</div>

<!-- Fragment para paginacion -->
<div th:fragment="paginacion (page, totalPages)" class="paginacion" style="text-align: center; margin-top: 20px;">
    <a th:if="${page > 1}"
       th:href="@{/adoption-list(page=${page - 1})}"
       style="padding: 10px 15px; margin: 0 5px; background-color: #007bff; color: white; text-decoration: none; border-radius: 5px;">
         Anterior
    </a>

    <span style="padding: 10px 15px; margin: 0 5px;">
            Página <span th:text="${page}"></span> de <span th:text="${totalPages}"></span>
        </span>

    <a th:if="${page < totalPages}"
       th:href="@{/adoption-list(page=${page + 1})}"
       style="padding: 10px 15px; margin: 0 5px; background-color: #007bff; color: white; text-decoration: none; border-radius: 5px;">
        Siguiente
    </a>
</div>
</body>
</html>
