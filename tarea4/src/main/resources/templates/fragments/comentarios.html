<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Fragment para la seccion completa de comentarios -->
<div th:fragment="seccion-comentarios" class="comentarios-seccion">
    <h3>Comentarios</h3>

    <!-- Formulario para agregar comentario -->
    <div th:replace="~{fragments/comentarios :: form-comentario}"></div>

    <!-- Lista de comentarios -->
    <div th:replace="~{fragments/comentarios :: lista-comentarios}"></div>
</div>

<!-- Fragment para el formulario de comentarios -->
<div th:fragment="form-comentario" class="comentario-form-container">
    <h4>Agregar un comentario</h4>
    <form id="form-comentario" class="comentario-form">
        <div class="form-group">
            <label for="comentario-nombre">Nombre:</label>
            <input type="text"
                   id="comentario-nombre"
                   name="nombre"
                   minlength="3"
                   maxlength="80"
                   required
                   placeholder="Tu nombre (mín. 3 caracteres)">
        </div>

        <div class="form-group">
            <label for="comentario-texto">Comentario:</label>
            <textarea id="comentario-texto"
                      name="texto"
                      rows="4"
                      cols="50"
                      minlength="5"
                      maxlength="300"
                      required
                      placeholder="Escribe tu comentario (mín. 5 caracteres)"></textarea>
        </div>

        <div id="comentario-errores" class="errores-comentario"></div>

        <button type="submit" class="btn-agregar-comentario">Agregar comentario</button>
    </form>
</div>

<!-- Fragment para la lista de comentarios -->
<div th:fragment="lista-comentarios" class="comentarios-lista">
    <h4>Comentarios anteriores</h4>
    <div id="lista-comentarios">
        <p class="cargando">Cargando comentarios...</p>
    </div>
</div>
</body>
</html>
